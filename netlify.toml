[build]
  publish = "."

# Žádný build příkaz – čistý statický web

[[headers]]
  for = "/*"
  [headers.values]
    # Vložit do iframe smí jen Inspiruj.se a jeho subdomény
    Content-Security-Policy = "frame-ancestors 'self' https://inspiruj.se https://*.inspiruj.se"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
