<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pátek třináctého – kolik jste jich už přežili?</title>
  <meta name="description" content="Zadejte datum narození a zjistěte, kolik pátků třináctého už máte za sebou. Včetně seznamu všech dat." />
  <meta name="theme-color" content="#09090b" />

  <!-- Náhled při sdílení na sítích -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="cs_CZ" />
  <meta property="og:title" content="Kolik pátků třináctého jste už přežili?" />
  <meta property="og:description" content="Zadejte datum narození a zjistěte, kolik pátků třináctého už máte za sebou." />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">

    <!-- Hlavička -->
    <header class="hero">
      <h1>Kolik <em>pátků třináctého</em> jste už přežili?</h1>
    </header>

    <!-- Přepínač režimů -->
    <div class="mode-switch" role="tablist" aria-label="Režim výpočtu">
      <button class="mode-btn active" id="tabBirth" data-mode="birth" type="button" role="tab" aria-selected="true" aria-controls="panelBirth">Můj život</button>
      <button class="mode-btn" id="tabRange" data-mode="range" type="button" role="tab" aria-selected="false" aria-controls="panelRange" tabindex="-1">Vlastní rozmezí</button>
    </div>

    <!-- Režim: datum narození -->
    <form class="panel" id="panelBirth" role="tabpanel" aria-labelledby="tabBirth" novalidate>
      <label for="birthDate">Datum narození</label>
      <input type="date" id="birthDate" />
      <button class="btn-primary" type="submit">Spočítat</button>
    </form>

    <!-- Režim: vlastní rozmezí -->
    <form class="panel hidden" id="panelRange" role="tabpanel" aria-labelledby="tabRange" novalidate>
      <div class="date-row">
        <div class="date-field">
          <label for="fromDate">Od</label>
          <input type="date" id="fromDate" max="9999-12-31" />
        </div>
        <div class="date-field">
          <label for="toDate">Do</label>
          <input type="date" id="toDate" max="9999-12-31" />
        </div>
      </div>
      <button class="btn-primary" type="submit">Spočítat</button>
    </form>

    <!-- Chybová hláška -->
    <div class="error-box hidden" id="errorBox" role="alert"></div>

    <!-- Výsledek -->
    <section class="result-card hidden" id="resultCard">
      <div class="result-number" id="resultNumber">0</div>
      <div class="result-label" id="resultLabel"></div>
      <p class="result-detail" id="resultDetail"></p>

      <details class="date-list-wrapper" id="dateListWrapper">
        <summary>Zobrazit všechna data</summary>
        <ul class="date-list" id="dateList"></ul>
      </details>
    </section>

    <!-- Patička -->
    <footer class="footer">
      <p class="footer-promo">Zajímá vás, jak můžete AI využít ve své profesi nebo koníčku? Přesně to učíme na našich kurzech a workshopech na <a href="https://inspiruj.se" target="_blank" rel="noopener">Inspiruj.se</a>.</p>
      <p class="footer-copy">&copy; v pátek třináctého 2026</p>
    </footer>

  </main>

  <script src="friday13.js"></script>
  <script src="app.js"></script>
</body>
</html>
